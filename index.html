<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTR</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --main:#6d3b12;
}

body{
  margin:0;
  font-family:'Tajawal',sans-serif;
  background:#0a0a0a;
  color:white;
}

/* NAV */
.navbar{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:center;
  gap:30px;
  background:#000;
  padding:15px;
  border-bottom:1px solid var(--main);
  z-index:999;
}

.navbar a{
  color:var(--main);
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
}

/* SECTIONS */
.section{display:none;padding-top:80px;}
.active{display:block;}

/* HOME */
.banner{height:260px;}
.banner img{width:100%;height:100%;object-fit:cover;}

.profile{
  display:flex;
  justify-content:center;
  margin-top:-40px;
}

.profile img{
  width:90px;
  height:90px;
  border-radius:20px;
  border:3px solid var(--main);
}

.center-text{
  text-align:center;
  margin:15px;
}

/* CARDS */
.cards{
  max-width:600px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:20px;
}

.card{
  height:120px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--main);
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* SOCIAL */
.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.social-card{
  display:flex;
  justify-content:space-between;
  background:#1a1a1a;
  padding:15px;
  margin-bottom:10px;
  border-radius:12px;
  color:white;
  text-decoration:none;
}

/* CHAT */
.chat{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.msg-box{
  height:300px;
  overflow:auto;
  background:#111;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

input,button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:8px;
}

button{
  background:var(--main);
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="navbar">
  <a onclick="show('home')">الرئيسية</a>
  <a onclick="show('social')">حساباتي</a>
  <a onclick="show('chat')">الشات</a>
</div>

<!-- HOME -->
<div id="home" class="section active">

  <div class="banner">
    <img src="https://media.discordapp.net/attachments/1500200151128735947/1501184078421037126/Majlis.png?ex=69fbcede&is=69fa7d5e&hm=8e6e8726fa3b8e918ebd575e0a219d9aafa5d0b37c42cce3c5ba4b20ee8ad0d7&=&format=webp&quality=lossless&width=1103&height=609">
  </div>
  </div>

  <div class="profile">
    <img src="https://media.discordapp.net/attachments/1500200151128735947/1501184025203838986/E4E7F7AD-0B1E-4050-B194-24831F04650B.png?ex=69fbced2&is=69fa7d52&hm=b32e721ef0403cc15eb899d97a2fde99ac8a64587dbc09b3e0a5e0b84f696a0d&=&format=webp&quality=lossless&width=786&height=786">
  </div>

  <div class="center-text">
    لاعب في سيرفر ريسبكت 8l8 gang مفلح شليويح
  </div>

  <div class="cards">
   <div class="card"><img src="https://media.discordapp.net/attachments/1500200151128735947/1501533212965339237/Screenshot_2026-04-11_040603.png?ex=69fc6b47&is=69fb19c7&hm=d408aafc87a8f3e1ed07d9ed8acd59636c636a45168f06e3354ff62a1de7546f&=&format=webp&quality=lossless&width=1460&height=630"></div>
    <div class="card"><img src="https://media.discordapp.net/attachments/1500200151128735947/1501533214471360552/Screenshot_2026-04-11_033617.png?ex=69fc6b47&is=69fb19c7&hm=5c933d4a5a8832a29071436b26efdc38ac8562140d54ad69b158c96f524dfe7c&=&format=webp&quality=lossless&width=1469&height=630"></div>
    <div class="card"><img src="https://media.discordapp.net/attachments/1500200151128735947/1501533213930291240/Screenshot_2026-04-11_034631.png?ex=69fc6b47&is=69fb19c7&hm=92ffd2c4d322db931ddea9334cb857be7dc750c022ebf059bb95750603327862&=&format=webp&quality=lossless&width=1505&height=630"></div>
  </div>

</div>

<!-- SOCIAL -->
<div id="social" class="section">
  <div class="container">
    <h2>حساباتي</h2>

    <a class="social-card" href="https://kick.com">Kick</a>
    <a class="social-card" href="https://x.com">X</a>
    <a class="social-card" href="https://discord.gg">Discord</a>

  </div>
</div>

<!-- CHAT -->
<div id="chat" class="section">
<div class="chat">

  <div class="msg-box" id="box"></div>

  <input id="msg" placeholder="اكتب رسالة">
  <button onclick="send()">إرسال</button>
  <button onclick="admin()">لوحة الإدارة</button>

</div>
</div>

<script>

/* 🔒 نظام يوزر ثابت */
let username = localStorage.getItem("username");
let locked = localStorage.getItem("usernameLocked");

window.onload = function(){

  if(!username){
    username = prompt("اختر اسمك (مرة واحدة فقط)");
    if(!username) username = "مجهول";

    localStorage.setItem("username", username);
    localStorage.setItem("usernameLocked", "true");
  }

  if(locked === "true"){
    username = localStorage.getItem("username");
  }
};

/* NAV */
function show(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* كلمات محظورة */
const badWords = ["زق","تبن","خرا","كس","زب","كلب","حيوان","حمار"];
let banList = [];
let timeoutList = {};

/* فلترة */
function clean(text){
  badWords.forEach(w=>{
    text = text.replaceAll(w,"***");
  });
  return text;
}

/* CHAT */
function send(){

  let name = username;
  let msg = document.getElementById('msg').value;

  if(banList.includes(name)) return alert("انت موقوف");

  if(timeoutList[name] && timeoutList[name] > Date.now()){
    return alert("تايم اوت");
  }

  msg = clean(msg);

  let div = document.createElement('div');
  div.innerText = name + ": " + msg;

  document.getElementById('box').appendChild(div);

  document.getElementById('msg').value="";
}

/* ADMIN */
function admin(){

  let pass = prompt("كلمة المرور");

  if(pass !== "vel123") return alert("خطأ");

  let type = prompt("1-ban / 2-timeout");
  let user = prompt("اسم اللاعب");

  if(type=="1"){
    banList.push(user);
    alert("تم البان");
  }

  if(type=="2"){
    let min = prompt("كم دقيقة");
    timeoutList[user] = Date.now() + min*60000;
    alert("تم التايم اوت");
  }
}

</script>

</body>
</html>
